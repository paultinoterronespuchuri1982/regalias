name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar Chromium para las pruebas del navegador
        run: python -m playwright install --with-deps chromium

      - name: Lint y formato
        run: |
          ruff check .
          ruff format --check .

      - name: Análisis de seguridad del código
        run: bandit -q -r regalias

      - name: Auditoría de dependencias
        run: pip-audit

      - name: Pruebas
        run: python -m pytest -o addopts="" -q
