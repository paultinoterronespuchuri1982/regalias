[project]
name = "regalias"
version = "0.1.0"
description = "Control de regalías para artistas independientes: personas, canciones, ingresos y reportes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Las plantillas XML de xlsx.py son cadenas largas por diseño.
"regalias/xlsx.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv312"]
